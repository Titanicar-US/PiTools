{{- if .Values.piWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pitools.fullname" . }}-pi-worker
  labels:
    {{- include "pitools.labels" . | nindent 4 }}
    app.kubernetes.io/component: pi-worker
spec:
  replicas: {{ .Values.piWorker.replicas }}
  selector:
    matchLabels:
      {{- include "pitools.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: pi-worker
  template:
    metadata:
      labels:
        {{- include "pitools.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pi-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pi-worker
          image: {{ include "pitools.piWorkerImage" . | quote }}
          imagePullPolicy: {{ .Values.piWorker.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "node", "/opt/pitools/pi/dist/main.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "externalServices.nats.existingSecret is required" .Values.externalServices.nats.existingSecret }}
                  key: {{ required "externalServices.nats.urlKey is required" .Values.externalServices.nats.urlKey }}
            - name: PITOOLS_PI_TRANSPORT
              value: nats
            - name: TMPDIR
              value: /tmp
          resources:
            {{- toYaml .Values.piWorker.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
