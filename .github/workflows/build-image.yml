name: build-image

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, verified 2026-08-10
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: workers/pi/package-lock.json
      - run: make install
      - run: make check
      - run: helm/pitools/ci/verify-render.sh

  validate-image:
    needs: validate-source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            dockerfile: Dockerfile
          - name: runner
            dockerfile: runner/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false

  publish-image:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: validate-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            image: pitools
            dockerfile: Dockerfile
          - name: runner
            image: pitools-runner
            dockerfile: runner/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "image publication requires an exact vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: image
        name: Resolve image coordinates
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tag="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/:@' '-')"
          printf 'repository=ghcr.io/%s/%s\n' "${owner}" "${IMAGE_NAME}" >>"${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >>"${GITHUB_OUTPUT}"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Record immutable image digest
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "${IMAGE_DIGEST}"
          {
            echo "### Published PiTools image"
            echo "- image: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`"
            echo "- tag: \`${IMAGE_TAG}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
