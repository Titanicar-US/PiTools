name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: pitools
          POSTGRES_USER: pitools
          POSTGRES_PASSWORD: pitools-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitools -d pitools"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pitools:pitools-ci@127.0.0.1:5432/pitools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, verified 2026-08-10
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: workers/pi/package-lock.json
      - run: make install
      - run: make check
      - run: helm/pitools/ci/verify-render.sh

  check-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: pitools
          POSTGRES_USER: pitools
          POSTGRES_PASSWORD: pitools-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitools -d pitools"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://pitools:pitools-ci@127.0.0.1:5432/pitools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, verified 2026-08-10
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: workers/pi/package-lock.json
      - run: make install
      - run: make check-full

  quality-gates:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, verified 2026-08-10
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: workers/pi/package-lock.json
      - run: make install
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: make quality-gates
