apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitools-pi-worker
  namespace: codex-specops
  labels:
    app.kubernetes.io/name: pitools
    app.kubernetes.io/instance: pitools
    app.kubernetes.io/part-of: pitools
    app.kubernetes.io/managed-by: fluxcd
    app.kubernetes.io/component: pi-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pitools
      app.kubernetes.io/instance: pitools
      app.kubernetes.io/component: pi-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pitools
        app.kubernetes.io/instance: pitools
        app.kubernetes.io/part-of: pitools
        app.kubernetes.io/managed-by: fluxcd
        app.kubernetes.io/component: pi-worker
    spec:
      serviceAccountName: pitools
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-worker
          image: ghcr.io/titanicar-us/pitools-runner@sha256:35d01c8332d0ea62b0df5dd67d6c782a09b7c4b1dbe3c775b78fa8391e391fe4
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "--", "node", "/opt/pitools/pi/dist/main.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          env:
            - name: NATS_URL
              valueFrom:
                secretKeyRef:
                  name: pitools-nats
                  key: nats-url
            - name: PITOOLS_PI_TRANSPORT
              value: nats
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
